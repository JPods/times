<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshMobility — Network Library</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e0e0e0; background: #0a1520; }
  a { color: #5cb8ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .topbar {
    background: #0f1f2f; border-bottom: 1px solid #1a3050;
    padding: 12px 24px; display: flex; align-items: center; gap: 20px;
  }
  .topbar h1 { font-size: 1.3em; font-weight: 300; }
  .topbar h1 span { color: #2e8b57; font-weight: 600; }
  .topbar .nav a {
    color: #7aa; font-size: 0.9em; padding: 4px 12px;
    border-radius: 4px; transition: background 0.15s;
  }
  .topbar .nav a:hover { background: rgba(255,255,255,0.08); color: #bdd; text-decoration: none; }
  .topbar .stats { margin-left: auto; font-size: 0.85em; color: #567; }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .filters {
    display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
  }
  .filters input, .filters select {
    padding: 8px 12px; background: #152030; border: 1px solid #2a4060;
    border-radius: 6px; color: #ddd; font-size: 0.9em;
  }
  .filters input { flex: 1; min-width: 200px; }
  .filters input::placeholder { color: #456; }
  .filters input:focus, .filters select:focus { outline: none; border-color: #4488cc; }

  .region-group { margin-bottom: 28px; }
  .region-header {
    font-size: 1.1em; color: #8ab; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid #1a3050;
    cursor: pointer; user-select: none;
  }
  .region-header:hover { color: #bdf; }
  .region-header .count { color: #456; font-size: 0.85em; margin-left: 8px; }
  .region-header::before { content: '▾ '; font-size: 0.8em; }
  .region-header.collapsed::before { content: '▸ '; }

  .network-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .network-card {
    background: #12202e; border: 1px solid #1a3050; border-radius: 8px;
    padding: 16px; transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }
  .network-card:hover { border-color: #2e8b57; transform: translateY(-2px); }
  .network-card .city { font-size: 1.1em; font-weight: 600; color: #ddd; margin-bottom: 4px; }
  .network-card .meta { font-size: 0.8em; color: #567; margin-bottom: 8px; }

  .network-card .stats-row {
    display: flex; gap: 12px; margin-bottom: 8px;
  }
  .network-card .stat-chip {
    background: #0a1520; padding: 4px 10px; border-radius: 4px;
    font-size: 0.8em; color: #7a9;
  }

  .network-card .ratings {
    display: flex; gap: 16px; font-size: 0.8em; color: #567;
  }
  .network-card .rating-bar {
    display: inline-block; width: 60px; height: 6px;
    background: #1a2a3a; border-radius: 3px; vertical-align: middle;
    margin-left: 4px; position: relative; overflow: hidden;
  }
  .network-card .rating-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    border-radius: 3px;
  }

  .network-card .actions {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .network-card .act-btn {
    padding: 5px 14px; border-radius: 5px; font-size: 0.8em;
    border: 1px solid #2a4060; background: #152030; color: #8ab;
    cursor: pointer; transition: background 0.15s;
  }
  .network-card .act-btn:hover { background: #1a3050; color: #bdf; }
  .network-card .act-btn.primary { background: #1a4a3a; border-color: #2a6a5a; color: #9dc; }
  .network-card .act-btn.primary:hover { background: #2a6a5a; color: white; }

  .developer { font-size: 0.8em; color: #456; margin-top: 8px; }
  .developer .name { color: #6a8; }

  .empty { text-align: center; padding: 60px; color: #456; }

  @media (max-width: 600px) {
    .network-grid { grid-template-columns: 1fr; }
    .filters { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1><span>Mesh</span>Mobility Library</h1>
  <div class="nav">
    <a href="/">Home</a>
    <a href="/app">Design</a>
    <a href="/citytool">CityTool</a>
  </div>
  <div class="stats" id="lib-stats"></div>
</div>

<div class="container">

  <div class="filters">
    <input type="text" id="filter-search" placeholder="Search city, state, or country..." oninput="Library.filter()">
    <select id="filter-country" onchange="Library.filter()">
      <option value="">All Countries</option>
    </select>
  </div>

  <div id="lib-content">
    <div class="empty">Loading library...</div>
  </div>

</div>

<script>
const Library = (() => {
  let _data = [];
  let _filtered = [];

  function _completeness(n) {
    // Simple completeness heuristic based on structure count and data
    if (n.total === 0) return 0;
    if (n.total < 20) return 20;
    if (n.total < 50) return 40;
    if (n.total < 100) return 60;
    if (n.total < 200) return 80;
    return 95;
  }

  function _ratingBar(pct, color) {
    return `<span class="rating-bar"><span class="rating-fill" style="width:${pct}%;background:${color}"></span></span>`;
  }

  function _renderCard(n) {
    const comp = _completeness(n);
    const compColor = comp > 70 ? '#2e8b57' : comp > 40 ? '#cc8800' : '#884444';
    const region = n.state ? `${n.state}, ${n.country}` : n.country;

    return `
      <div class="network-card" onclick="Library.open('${n.filename}')">
        <div class="city">${n.city || n.name}</div>
        <div class="meta">${region} · ${n.modified} · ${n.size_kb}KB</div>
        <div class="stats-row">
          <span class="stat-chip">${n.total} structures</span>
          <span class="stat-chip">${n.stations} stations</span>
          <span class="stat-chip">${n.circles} circles</span>
        </div>
        <div class="ratings">
          <span>Completeness ${_ratingBar(comp, compColor)}</span>
        </div>
        <div class="developer">by <span class="name">${n.developer || 'JPods'}</span></div>
        <div class="actions">
          <button class="act-btn primary" onclick="event.stopPropagation(); Library.open('${n.filename}')">Open</button>
          <button class="act-btn" onclick="event.stopPropagation(); Library.clone('${n.filename}')">Clone &amp; Edit</button>
        </div>
      </div>`;
  }

  function _render() {
    const container = document.getElementById("lib-content");
    if (!_filtered.length) {
      container.innerHTML = '<div class="empty">No networks match your search.</div>';
      return;
    }

    // Group by country/state
    const groups = {};
    _filtered.forEach(n => {
      const key = n.state ? `${n.country} / ${n.state}` : n.country;
      if (!groups[key]) groups[key] = [];
      groups[key].push(n);
    });

    let html = '';
    Object.keys(groups).sort().forEach(region => {
      const nets = groups[region];
      const countryNames = { US: 'United States', CAN: 'Canada', GRM: 'Germany', Dubai: 'UAE', Kyrgystan: 'Kyrgyzstan', Liberia: 'Liberia' };
      const parts = region.split(' / ');
      const displayRegion = parts.length > 1
        ? `${parts[1]}, ${countryNames[parts[0]] || parts[0]}`
        : countryNames[region] || region;

      html += `<div class="region-group">`;
      html += `<div class="region-header" onclick="this.classList.toggle('collapsed'); this.nextElementSibling.style.display = this.classList.contains('collapsed') ? 'none' : 'grid'">${displayRegion}<span class="count">${nets.length} network${nets.length > 1 ? 's' : ''}</span></div>`;
      html += `<div class="network-grid">`;
      nets.forEach(n => { html += _renderCard(n); });
      html += `</div></div>`;
    });
    container.innerHTML = html;
  }

  return {
    async init() {
      try {
        const r = await fetch("/api/library");
        const data = await r.json();
        _data = data.networks || [];
        _filtered = _data;

        document.getElementById("lib-stats").textContent =
          `${_data.length} networks · ${new Set(_data.map(n => n.country)).size} countries`;

        // Populate country filter
        const countries = [...new Set(_data.map(n => n.country))].sort();
        const sel = document.getElementById("filter-country");
        countries.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c; opt.textContent = c;
          sel.appendChild(opt);
        });

        _render();
      } catch (e) {
        document.getElementById("lib-content").innerHTML =
          `<div class="empty">Failed to load library: ${e.message}</div>`;
      }
    },

    filter() {
      const q = document.getElementById("filter-search").value.toLowerCase();
      const country = document.getElementById("filter-country").value;
      _filtered = _data.filter(n => {
        if (country && n.country !== country) return false;
        if (q && !(n.city + ' ' + n.state + ' ' + n.country + ' ' + n.name).toLowerCase().includes(q)) return false;
        return true;
      });
      _render();
    },

    open(filename) {
      window.location.href = `/app?load=${encodeURIComponent(filename)}`;
    },

    clone(filename) {
      window.location.href = `/app?clone=${encodeURIComponent(filename)}`;
    },
  };
})();

Library.init();
</script>

</body>
</html>
